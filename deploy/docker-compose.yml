# Zogency self-hosted stack (doc 02 §11.2): app + Postgres + Redis + Caddy TLS.
# Managed by deploy/install.sh — configuration lives in ../.env.production.
name: zogency

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/zogency
      REDIS_URL: ""            # BullMQ transport activates in a later release
      ZOGENCY_DEPLOY_MODE: self_hosted
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zogency
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zogency"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Nightly database dump into ./backups (offsite copies are the operator's
  # responsibility — doc 02 §11.2).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U postgres zogency | gzip > /backups/zogency-$$(date +%Y%m%d).sql.gz
          find /backups -name 'zogency-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
